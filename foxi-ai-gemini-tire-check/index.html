<style>

;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.16));z-index:1}.upload.has-img .up-icon,.upload.has-img .up-title,.upload.has-img .up-hint{position:relative;z-index:2;color:white;border-color:white}.upload.has-img .up-icon{background:rgba(255,255,255,.18)}.mini-checks{display:grid;gap:8px;margin-top:12px}.mini-q{border:1px solid var(--line);border-radius:18px;padding:10px;background:#fafafa}.mini-title{font-weight:950;font-size:13px;margin-bottom:8px}.mini-seg{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini-seg button{border:1px solid #dedede;background:white;color:#222;border-radius:14px;padding:9px 7px;font-weight:950;font-size:13px}.mini-seg button.selected{background:#111;color:white;border-color:#111}.mini-seg button.bad.selected{background:var(--red);border-color:var(--red)}.mini-seg button.warn.selected{background:var(--yellow);border-color:var(--yellow);color:#111}.btn{min-height:54px;border:0;border-radius:18px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;cursor:pointer;gap:8px}.btn-primary,.btn-dark{background:var(--orange);color:white;box-shadow:0 14px 30px rgba(255,59,0,.23)}.btn-primary:hover,.btn-dark:hover{background:var(--orange-dark)}.btn-light{background:white;color:#111;border:1px solid #ddd}.btn-full{width:100%}.ai-status{display:none;align-items:center;gap:12px;background:#fff7f4;border:1px solid #ffe0d5;border-radius:18px;padding:12px 14px;color:#5b2514;font-size:13px;font-weight:850}.ai-status.show{display:flex}.tire-loader{width:42px;height:42px;border-radius:50%;border:7px solid #111;position:relative;flex:0 0 42px;animation:spinTire 2.4s linear infinite;background:white}.tire-loader:before{content:"";position:absolute;inset:8px;border-radius:50%;border:4px solid #bbb;background:white}.tire-loader:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:28px;background:#777;transform:translate(-50%,-50%);box-shadow:0 0 0 2px white}@keyframes spinTire{to{transform:rotate(360deg)}}.result{display:none}.result.show{display:block}.tire-result{background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.08);border-radius:22px;padding:14px;margin-bottom:12px}.badge{display:inline-flex;border-radius:999px;padding:8px 12px;background:#111;color:white;font-weight:950;font-size:13px}.badge.green{background:var(--green)}.badge.yellow{background:var(--yellow);color:#111}.badge.red{background:var(--red)}.pill{display:inline-flex;align-items:center;gap:7px;margin:0 7px 8px 0;padding:8px 11px;border-radius:999px;background:#111;color:white;font-size:13px;font-weight:950}.pill.light{background:white;border:1px solid rgba(0,0,0,.14);color:#444}.result-copy{margin:0;color:#303030;font-weight:750}.scale{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 40%,var(--yellow) 40% 70%,var(--green) 70% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);margin:18px 0 7px}.marker{position:absolute;top:-7px;left:calc(var(--score,5)*10%);width:3px;height:28px;border-radius:3px;background:#111;transform:translateX(-50%);box-shadow:0 0 0 3px white}.marker:after{content:attr(data-score);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#111;color:white;border-radius:999px;padding:3px 7px;font-size:11px}.score-labels{display:grid;grid-template-columns:repeat(11,1fr);font-size:9px;color:#555;font-weight:900;text-align:center;margin-bottom:10px}.result-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.booking-note{margin:0 0 10px;color:#303030;font-weight:850;text-align:center}.booking-note strong{color:var(--orange)}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:white;border-radius:999px;padding:12px 16px;font-weight:900;display:none;z-index:99;box-shadow:var(--shadow);max-width:calc(100vw - 30px);text-align:center}.footer{padding:12px 0 34px;text-align:center;color:#777;font-size:12px}@media(min-width:760px){.upload-grid{grid-template-columns:repeat(3,1fr)}.mini-checks{grid-template-columns:repeat(3,1fr)}.upload{min-height:168px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.panel,.result{padding:22px}.hero-card{padding:38px 32px}}@media(max-width:430px){.orders{display:none}.brand img{width:104px}.hero-card{border-radius:26px}.panel,.result{border-radius:22px}h1{font-size:42px}}
</style>

<body>
<header class="topbar"><div class="shell nav"><a class="brand" href="https://www.foxitire.com/"><img src="https://www.foxitire.com/images/foxi_logo.svg" alt="FOXI"><span>FOXI</span></a><div class="actions"><a class="orders" href="https://www.foxitire.com/booking/check">My Orders</a><button class="hamb" type="button" aria-label="Menu"><span></span><span></span><span></span></button></div></div></header>
<main><section class="hero"><div class="shell"><div class="hero-card"><h1><span>FOXI AI:</span><br><span class="orange">Tire Health Check.</span></h1></div></div></section>
<section class="shell main"><div class="panel"><div class="panel-head"><div class="step">1</div><div><div class="title">Tire photos</div><div class="sub">Add 1-4 tires. Three photos per tire.</div></div></div><div id="tireList"></div><button class="btn btn-light btn-full" id="addTireBtn" type="button">Add tire</button></div>
<button class="btn btn-primary btn-full" id="checkBtn" type="button">Start AI health check</button><div id="modelStatus" class="ai-status"><span class="tire-loader"></span><span id="statusText"></span></div>
<div id="result" class="result"><div id="advice"></div><div class="result-actions"><p class="booking-note"><strong>Free booking.</strong> If the store confirms no replacement is needed, you pay nothing.</p><button class="btn btn-dark" id="bookingBtn" type="button">Free booking</button></div></div>
</section></main><div class="footer"><strong>FOXI</strong> - Fit first, pay at store.</div><div class="toast" id="toast"></div>
<script>
let detectedSize=null,lastResults=null,bookingTarget=null;const tireSets=[],requiredPhotos=["overall","tread","sidewall"],positions=["any","front-left","front-right","rear-left","rear-right"],checkDefs=[["bulge","Bulge?","yes","no"],["leak","Slow air loss?","yes","no"],["repair","Repaired 3+?","yes","no"]],$=id=>document.getElementById(id);
function toast(msg){const el=$("toast");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",4200)}function status(msg,on=true){$("statusText").textContent=msg;$("modelStatus").classList.toggle("show",on)}function fail(msg){toast(msg);status(msg,true);$("modelStatus").scrollIntoView({behavior:"smooth",block:"center"})}function missingPhotos(tire){return requiredPhotos.filter(k=>!tire.photos[k]).map(roleTitle).join(", ")}function missingChecks(tire){return checkDefs.filter(([key])=>!tire.checks[key]).map(x=>x[1]).join(", ")}function normalizeText(text){return(text||"").toUpperCase().replaceAll("O","0").replaceAll("Q","0").replaceAll("|","1").replace(/[^A-Z0-9\/\-\s.]/g," ")}function parseTireSize(text){const s=normalizeText(text),patterns=[/(?:P|LT)?\s*([1-3][0-9]{2})\s*[\/\\\-]\s*([2-9][0-9])\s*(?:ZR|R)\s*([1-2][0-9])/,/(?:P|LT)?\s*([1-3][0-9]{2})([2-9][0-9])\s*(?:ZR|R)\s*([1-2][0-9])/];for(const p of patterns){const m=s.match(p);if(m){const width=+m[1],profile=+m[2],rim=+m[3];if(width>=145&&width<=355&&profile>=20&&profile<=95&&rim>=10&&rim<=24)return{width:String(width),profile:String(profile),rim:String(rim),text:`${width}/${profile} R${rim}`,confidence:.75}}}return null}function parseDot(code){const m=normalizeText(code).match(/([0-5][0-9][0-4][0-9])/);if(!m)return null;const c=m[1],week=+c.slice(0,2),yy=+c.slice(2);if(week<1||week>53)return null;const year=yy<=40?2000+yy:1900+yy,month=Math.min(12,Math.max(1,Math.round(week/4.345))),now=new Date();return{code:c,week,year,month,months:Math.max(0,(now.getFullYear()-year)*12+(now.getMonth()+1-month))}}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function levelFromScore(score){return score<4?"red":score<7?"yellow":"green"}function posLabel(p){return{any:"Position not sure","front-left":"Front left","front-right":"Front right","rear-left":"Rear left","rear-right":"Rear right"}[p]||"Position not sure"}
function makeTire(){return{id:Date.now()+Math.random(),position:"any",photos:{},files:{},previews:{},checks:{}}}function roleSvg(role){if(role==="overall")return'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26"></circle><circle cx="32" cy="32" r="15"></circle><circle cx="32" cy="32" r="4"></circle><path d="M32 17v11M32 36v11M17 32h11M36 32h11M21 21l8 8M43 43l-8-8M43 21l-8 8M21 43l8-8"></path></svg>';if(role==="tread")return'<svg viewBox="0 0 64 64"><path d="M14 50 25 12h26L39 56H17Z"></path><path d="M24 16 16 47M33 16 25 52M42 16 34 53M50 18 42 48"></path><path d="M24 22h22M20 33h23M17 44h22"></path><path d="M29 13l18 10M24 30l18 10M20 47l13 7"></path></svg>';return'<svg viewBox="0 0 64 64"><path d="M7 55c6-25 24-43 50-48"></path><path d="M13 56c7-21 22-36 44-41"></path><path d="M20 55c7-15 18-26 35-30"></path><text x="18" y="34" font-size="8">215/55R17</text><text x="18" y="45" font-size="8">DOT1324</text></svg>'}function roleTitle(role){return role==="overall"?"Front":role==="tread"?"Tread":"Size / DOT"}function roleHint(role){return role==="overall"?"Photo or gallery":role==="tread"?"Grooves close-up":"Sidewall close-up"}
function checkButtons(tire){return`<div class="mini-checks">${checkDefs.map(([key,title,first,second])=>`<div class="mini-q"><div class="mini-title">${title}</div><div class="mini-seg">${[first,second].map(value=>{const risky=value==="yes"&&(key==="bulge"||key==="repair")?"bad":value==="yes"&&key==="leak"?"warn":"",selected=tire.checks[key]===value?"selected":"";return`<button type="button" class="${risky} ${selected}" data-check="${key}" data-v="${value}">${value==="yes"?"Yes":"No"}</button>`}).join("")}</div></div>`).join("")}</div>`}
function renderTires(){const list=$("tireList");list.innerHTML="";tireSets.forEach((tire,idx)=>{const card=document.createElement("div");card.className="tire-card";card.dataset.id=tire.id;card.innerHTML=`<div class="tire-top"><div class="tire-name">Tire ${idx+1}</div>${tireSets.length>1?`<button class="remove" type="button" data-remove="${tire.id}">Remove</button>`:""}</div><div class="position-row">${positions.map(p=>`<button type="button" data-pos="${p}" class="${tire.position===p?"selected":""}">${posLabel(p)}</button>`).join("")}</div><div class="upload-grid">${requiredPhotos.map(role=>`<label class="upload ${tire.photos[role]?"has-img":""}"><input type="file" accept="image/*" data-id="${tire.id}" data-photo="${role}"><img class="preview" alt="" ${tire.previews[role]?`src="${tire.previews[role]}" style="display:block"`:""}><span class="up-icon">${roleSvg(role)}</span><span><div class="up-title">${roleTitle(role)}</div><div class="up-hint">${roleHint(role)}</div></span></label>`).join("")}</div>${checkButtons(tire)}`;list.appendChild(card)});$("addTireBtn").style.display=tireSets.length>=4?"none":"inline-flex";list.querySelectorAll("[data-pos]").forEach(btn=>btn.onclick=()=>{const tire=tireSets.find(x=>x.id===+btn.closest(".tire-card").dataset.id);tire.position=btn.dataset.pos;renderTires()});list.querySelectorAll("[data-check]").forEach(btn=>btn.onclick=()=>{const tire=tireSets.find(x=>x.id===+btn.closest(".tire-card").dataset.id);tire.checks[btn.dataset.check]=btn.dataset.v;renderTires()});list.querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=()=>{const i=tireSets.findIndex(x=>x.id===+btn.dataset.remove);if(i>=0)tireSets.splice(i,1);renderTires()});list.querySelectorAll("input[type=file]").forEach(inp=>inp.onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const tire=tireSets.find(x=>x.id===+inp.dataset.id),role=inp.dataset.photo;tire.photos[role]=true;tire.files[role]=file;detectedSize=detectedSize||parseTireSize(file.name);const reader=new FileReader();reader.onload=ev=>{tire.previews[role]=ev.target.result;renderTires()};reader.readAsDataURL(file)})}
$("addTireBtn").onclick=()=>{if(tireSets.length<4){tireSets.push(makeTire());renderTires()}};
async function imageToInlineData(file,label){status(label||"Preparing photo...");const readOriginal=()=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const dataUrl=String(r.result||""),meta=dataUrl.match(/^data:([^;]+);base64,/);resolve({mimeType:meta?.[1]||file.type||"image/jpeg",data:dataUrl.split(",")[1]||""})};r.onerror=reject;r.readAsDataURL(file)});try{const img=await Promise.race([createImageBitmap(file),new Promise((_,reject)=>setTimeout(()=>reject(new Error("image-timeout")),8000))]),max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);if(img.close)img.close();return{mimeType:"image/jpeg",data:canvas.toDataURL("image/jpeg",.78).split(",")[1]}}catch(e){return await readOriginal()}}
function buildPrompt(){return["You are FOXI AI Tire Health Check for consumer tire photo screening in Saudi Arabia.","The customer may upload 1 to 4 tires. Analyze every tire independently. Do not make every tire red just because one tire is risky.","Each tire has three photos: full tire front, 45 degree tread, and sidewall size/DOT close-up.","For every tire, identify tire size, DOT date, tread wear, scratches/cuts, cracks, sidewall bulge, exposed cords, repair evidence, and photo quality.","If the customer reports sidewall bulge for a specific tire, that tire must be red and should be replaced or inspected immediately.","If the customer reports more than 3 repairs for a specific tire, that tire must be red because structure may be weakened.","Important DOT rule: if DOT manufacturing date is 3 years or more before today, that tire is an older tire in Saudi Arabia. Do not describe it as new or relatively new. Its tire score must be 5/10 or lower. Older than 5 years must be 3.5/10 or lower.","Return only valid JSON:",'{"tires":[{"index":1,"position":"","score":0,"riskLevel":"green|yellow|red","action":"no_replace|free_inspection|replace_soon","detectedSize":{"width":"","profile":"","rim":"","raw":"","confidence":0},"dot":{"code":"","week":0,"year":0,"confidence":0},"customerSummary":"","visibleFindings":[{"area":"tread|sidewall|shoulder|DOT|overall","severity":"healthy|minor|caution|serious","customerText":"short customer-safe explanation","confidence":0}],"confidence":0}]}',"Scores are 0-10. 10 means healthy. 0 means severe risk.","Uploaded tire checks: "+JSON.stringify(tireSets.map((x,i)=>({index:i+1,position:posLabel(x.position),checks:x.checks})))] .join("\n")}
async function callGemini(){const images=[];let n=0,total=tireSets.length*requiredPhotos.length;for(let i=0;i<tireSets.length;i++){for(const role of requiredPhotos){n++;const inline=await imageToInlineData(tireSets[i].files[role],`Preparing photo ${n}/${total}...`);images.push({tireIndex:i+1,position:posLabel(tireSets[i].position),role,...inline})}}try{status("AI is reading tire photos...");const res=await fetch("/.netlify/functions/gemini-tire-check",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt:buildPrompt(),images})});if(res.ok)return{aiMode:"gemini-function",...await res.json()}}catch(e){}return null}
function normalizeAiSize(size){if(!size)return null;const parsed=parseTireSize(size.raw||`${size.width||""}/${size.profile||""} R${size.rim||""}`);if(parsed&&Number(size.confidence||0)>=.35)return{...parsed,confidence:size.confidence||parsed.confidence};return null}function scoreFromTire(tire){let score=typeof tire?.score==="number"?clamp(tire.score,0,10):7;const dot=parseDot(tire?.dot?.code||"");if(dot){if(dot.months>=60)score=Math.min(score,3.5);else if(dot.months>=36)score=Math.min(score,5)}return{score,dot}}function bookingUrl(size){if(size){const q=new URLSearchParams({width:size.width,profile:size.profile,rim:size.rim,size:size.text});return"https://www.foxitire.com/?"+q.toString()+"#top-picks"}return"https://www.foxitire.com/"}
function normalizeResults(ai){const raw=Array.isArray(ai?.tires)?ai.tires:[];const tires=tireSets.map((set,i)=>{const item=raw.find(x=>Number(x.index)===i+1)||raw[i]||{},scored=scoreFromTire(item),size=normalizeAiSize(item.detectedSize);if(size&&!detectedSize)detectedSize=size;let score=scored.score,manualSummary="";if(set.checks.bulge==="yes"){score=Math.min(score,2.5);manualSummary="Bulge reported. Replace this tire soon and book a free store check."}else if(set.checks.repair==="yes"){score=Math.min(score,3.2);manualSummary="More than 3 repairs reported. Free store inspection is strongly recommended."}else if(set.checks.leak==="yes"){score=Math.min(score,6.5);manualSummary="Slow air loss reported. Free inspection is recommended before long or high-speed driving."}const aiLevel=item.riskLevel==="red"?"red":item.riskLevel==="yellow"&&score>=4?"yellow":levelFromScore(score),level=set.checks.bulge==="yes"||set.checks.repair==="yes"?"red":aiLevel;return{index:i+1,label:`Tire ${i+1} (${posLabel(set.position)})`,score,level,size,dot:scored.dot,summary:manualSummary||item.customerSummary||"",findings:item.visibleFindings||[],confidence:item.confidence||ai?.confidence||.55}});lastResults=tires;bookingTarget=tires.find(t=>t.level!=="green")||tires[0];return{tires}}
function dotText(dot){if(!dot)return"DOT not detected";return`DOT ${dot.code}${dot.months>=36?" - older tire":""}`}function oneFinding(tire){const f=(Array.isArray(tire.findings)?tire.findings:[]).find(x=>x&&x.customerText);return tire.summary||f?.customerText||"AI photo check complete."}function miniScore(score){score=Math.round(score*10)/10;return`<div><div class="scale" style="--score:${score}"><div class="marker" data-score="${score}"></div></div><div class="score-labels"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>`}function tireCardHtml(tire){const size=tire.size?`<span class="pill">${tire.size.text}</span>`:`<span class="pill light">Size not detected</span>`,action=tire.level==="green"?"No replacement now. Check before long trip.":tire.level==="yellow"?"Free inspection recommended.":"Replace or inspect ASAP.";return`<div class="tire-result"><div class="result-top"><div><strong>${tire.label}</strong><div>${size}<span class="pill light">${dotText(tire.dot)}</span></div></div><span class="badge ${tire.level}">${tire.level.toUpperCase()} ${Math.round(tire.score*10)/10}/10</span></div>${miniScore(tire.score)}<p class="result-copy">${oneFinding(tire)}</p><p class="result-copy" style="margin-top:8px">${action}</p></div>`}
async function runCheck(){const photoIndex=tireSets.findIndex(tire=>requiredPhotos.some(k=>!tire.photos[k]));if(photoIndex>=0){fail(`Tire ${photoIndex+1}: add ${missingPhotos(tireSets[photoIndex])}.`);return}const checkIndex=tireSets.findIndex(tire=>checkDefs.some(([key])=>!tire.checks[key]));if(checkIndex>=0){fail(`Tire ${checkIndex+1}: answer ${missingChecks(tireSets[checkIndex])}.`);return}$("checkBtn").disabled=true;$("checkBtn").textContent="Checking...";status("Starting AI check...");try{let ai=null;try{ai=await callGemini()}catch(e){ai=null}const result=normalizeResults(ai||{});$("result").className="result show";$("advice").innerHTML=result.tires.map(tireCardHtml).join("");$("bookingBtn").style.display="inline-flex";status("Done.");$("result").scrollIntoView({behavior:"smooth",block:"start"})}finally{$("checkBtn").disabled=false;$("checkBtn").textContent="Start AI health check"}}
$("checkBtn").onclick=runCheck;$("bookingBtn").onclick=()=>{if(!(bookingTarget?.size||detectedSize))toast("Please confirm tire size on FOXI before booking.");location.href=bookingUrl(bookingTarget?.size||detectedSize)};tireSets.push(makeTire());renderTires();
</script>
